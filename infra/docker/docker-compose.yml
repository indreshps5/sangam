version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sangam
      POSTGRES_PASSWORD: sangam
      POSTGRES_DB: sangam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangam"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: ../docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://sangam:sangam@postgres:5432/sangam
      DEBUG: "true"
      LOG_FORMAT: console
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
